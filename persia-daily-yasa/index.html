<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fa" />
  <title>오늘의 이란·페르시아 야사</title>
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <div class="page-wrap">
    <!-- 심플 헤더 -->
    <header class="top-bar">
      <div class="brand-group">
        <h1 class="site-title" id="btnHome">이란·페르시아 야사</h1>
        <div class="era-switch" role="navigation" aria-label="시대 전환">
          <a href="../samguk-daily-yasa/" class="era-tab">삼국</a>
          <a href="../goryeo-daily-yasa/" class="era-tab">고려</a>
          <a href="../joseon-daily-yasa/" class="era-tab">조선</a>
          <span class="era-tab active" aria-current="page">이란</span>
          <a href="../britain-daily-yasa/" class="era-tab">영국</a>
          <a href="../rome-daily-yasa/" class="era-tab">로마</a>
          <a href="../turkey-daily-yasa/" class="era-tab">터키</a>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="text-btn" id="btnAuth" title="구글 로그인으로 기기 간 즐겨찾기·메모 동기화">🔐 로그인</button>
        <button type="button" class="text-btn" id="btnToggleTheme" aria-label="테마 전환">🌙</button>
      </div>
    </header>

    <!-- 심플 날짜 이동 -->
    <nav class="date-bar" aria-label="날짜 이동">
      <button type="button" class="nav-arrow" id="btnPrevDay">‹ 어제</button>

      <div class="date-center">
        <button type="button" class="date-display" id="btnOpenDatePicker" title="날짜 선택">
          <span id="displayMonthDay">11월 12일</span>
        </button>
        <input type="date" id="datePicker" class="sr-only-date" aria-label="날짜 선택" />
        <button type="button" class="sub-link" id="btnToday">오늘</button>
        <span class="dot">·</span>
        <button type="button" class="sub-link" id="btnRandomDate">랜덤 날짜</button>
      </div>

      <button type="button" class="nav-arrow" id="btnNextDay">내일 ›</button>
    </nav>

    <!-- 심플 카테고리 슬라이드 탭 -->
    <div class="cat-bar-wrap">
      <button type="button" class="cat-scroll-btn" id="btnCatPrev" aria-label="카테고리 왼쪽으로 이동">‹</button>
      <div class="cat-bar" id="categoryBar">
        <button type="button" class="cat-link active" data-cat="all">전체</button>
        <button type="button" class="cat-link" data-cat="mystery">기이한 일</button>
        <button type="button" class="cat-link" data-cat="scandal">궁중 비화</button>
        <button type="button" class="cat-link" data-cat="folklore">야담·영웅</button>
        <button type="button" class="cat-link" data-cat="episode">왕의 일상</button>
        <button type="button" class="cat-link" data-cat="legends">명장면 모음</button>
        <button type="button" class="cat-link" data-cat="favorites" id="tabFavorites">⭐ 즐겨찾기</button>
        <button type="button" class="cat-link" data-cat="memos" id="tabMemos">📝 메모</button>
      </div>
      <button type="button" class="cat-scroll-btn" id="btnCatNext" aria-label="카테고리 오른쪽으로 이동">›</button>
    </div>

    <!-- 오늘자 야사 제목 리스트 바로가기 -->
    <nav id="quickTitleList" class="quick-title-box" aria-label="오늘의 야사 제목 바로가기"></nav>

    <!-- 본문 리스트 -->
    <main id="storiesContainer" class="story-list"></main>
  </div>

  <!-- 심플 하단 알림창 -->
  <div class="simple-toast" id="simpleToast">
    <div class="toast-inner">
      <p id="toastMessage"></p>
      <button type="button" id="btnCloseToast">닫기</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="data.js?v=1"></script>
  <script src="app.js?v=1"></script>
  <script src="firebase-sync.js?v=1"></script>
</body>
</html>
